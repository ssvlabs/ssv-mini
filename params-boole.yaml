# Boole fork test: genesis on Fulu, forks into Boole at epoch 3
# Usage: make run PARAMS_FILE=params-boole.yaml

network:
  participants:
  - el_type: geth
    el_image: ethereum/client-go:v1.16.7
    cl_type: lighthouse
    cl_image: sigp/lighthouse:v8.2.1
    validator_count: 32
    count: 2
    supernode: true

  additional_services:
    - dora

  network_params:
    network_id: "3151908"
    deneb_fork_epoch: 0
    electra_fork_epoch: 0
    # Fulu stays at genesis so it always precedes the SSV Boole fork (the chain is born on Fulu, with
    # no mid-run transition) and never falls inside the Boole measurement window. The BOOLE_FORK_EPOCH
    # knob retunes only boole_epoch (below), so this ordering holds for any boole_epoch >= 1.
    fulu_fork_epoch: 0
    perfect_peerdas_enabled: false
    preregistered_validator_count: 74

  port_publisher:
    cl:
      enabled: true

use_static_keys: true

# pre_register_validators for the boole net. See params.yaml for the flag's full semantics and its
# incompatibility with the executor's validator-registering suites. When enabled here, the deployer
# bulk-registers the full static keyshare set at bring-up so the fleet runs SSV-managed validators
# from genesis.
pre_register_validators: false

# ENABLED for the aetheria (boole) suite: it reads chain timing (genesis, seconds-per-slot,
# slots-per-epoch) from the monitor's /api/environment (dora doesn't serve it) to anchor its
# fork-relative windows. Needs a local image tagged `monitor` — build it via `make prepare-monitor`.
monitor:
  enabled: true

# SSV Boole fork epoch (Alan → Boole). Retune without editing this file via
# `make run-boole BOOLE_FORK_EPOCH=N`; the aetheria (boole) suite passes 8 for a comfortable
# pre-fork Alan window (its dormancy + aggregator-format-switch steps need one).
boole_epoch: 3

nodes:
  ssv:
    count: 4
  anchor:
    count: 0

images:
  ssv: "node/ssv"
  anchor: "sigp/anchor:v1.3.0"
  monitor: "monitor"
  redis: "redis:7.4.2"
  postgres: "postgres:15"
  deployer: "localssv/ssv-network"
