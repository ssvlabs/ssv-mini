# Network forks: genesis at Fulu (deneb + electra + fulu all at epoch 0) — the default net runs
# the current fork out of the box. Fulu was historically deferred (fulu_fork_epoch: 100000)
# because an old ethereum2-monitor (E2M) build couldn't parse Fulu blocks (its indexer FATAL'd
# with "unknown SignedBeaconBlock version fulu"). Current E2M builds decode Fulu natively
# (go-eth2-client v0.28.1 + beacon/fulu.go): proven on the params-gloas.yaml net (Fulu epochs 0-1
# en route to Gloas, ssvlabs/aetheria#137), then validated on THIS net by a Fulu-at-genesis
# aetheria (event) run — E2M attestation validation green, zero monitor decode failures. To pin
# the old Electra-only behavior, set fulu_fork_epoch to a large value (e.g. 100000).
# https://github.com/ethpandaops/ethereum-package/blob/main/network_params.yaml

network:
  participants:
  # el_image / cl_image default to constants.env's GETH_IMAGE / LIGHTHOUSE_IMAGE (main.star fills them in by
  # client type); set them here to run a different build.
  - el_type: geth
    cl_type: lighthouse
    validator_count: 32
    count: 2
    supernode: true

  additional_services:
    - dora

  network_params:
    network_id: "3151908"
    deneb_fork_epoch: 0
    electra_fork_epoch: 0
    fulu_fork_epoch: 0
    perfect_peerdas_enabled: false
    # The aetheria local_testnet seed (ssvlabs/aetheria orchestrator/script/insert_test_data.sql) is the set
    # of deposited-but-VC-idle validators the SSV operators adopt, at indices
    # [SSV_SEED_START_INDEX, +SSV_MANAGED_VALIDATOR_COUNT) of utils/constants.star ([64, 74) by default).
    # VCs run [0, total validator_count*count summed over all participant groups); genesis deposits
    # [0, preregistered). Keep the VC total == the seed start and preregistered_validator_count == the seed
    # end, both exactly (main.star asserts this by default; unsafe_skip_validator_layout_guard in
    # params-gloas.yaml opts out for standalone liveness probes), else operators would run VC-active
    # validators -> double-sign -> slashing. generate-static-keys.sh Step 4 syncs preregistered_validator_count.
    preregistered_validator_count: 74

  port_publisher:
    cl:
      enabled: true

# use_static_keys loads pre-computed operator keys (static/keys/operator-0..3) and a fixed keyshare set
# (static/keyshares/out.json: SSV_MANAGED_VALIDATOR_COUNT validators split across operators [1,2,3,4]).
# Only 4 static operator key sets exist, so the total cluster size (ssv + anchor nodes) must be 4. Set
# false to generate operators and keyshares dynamically for the larger BFT sizes (7/10/13).
use_static_keys: true

# pre_register_validators drives main.star Step 4: registering the keyshare validators on-chain.
# Default false preserves the aetheria flow (its executor registers and funds its own validators and
# expects a clean cluster). A standalone `kurtosis run` (no executor) needs this true so operators
# actually run validators; consumers gating CI without aetheria (e.g. sigp/anchor) opt in. See #29.
# When true, the static keyshares occupy the seed (see network_params above), which the executor's
# validator-registering suites ((event)/(ptc)/(proposer)/(p2p)) also register at test time, so running
# those suites against a FULL flag-on enclave reverts with ValidatorAlreadyExists — use standard
# (flag-off) enclaves, or partition the pool with pre_register_count below.
pre_register_validators: false

# pre_register_count partitions the static keyshare pool when pre_register_validators is true: register
# only the first N keyshares on-chain (cohort P, the seed's first N indices), leaving the rest of the seed
# for the aetheria executor to register as its own cohort (D). This index-partitioned P⊎D split lets pre-registration and
# a validator-registering suite share one enclave without the ValidatorAlreadyExists collision above —
# they register disjoint pubkeys under the same owner, and D's registration continues from N on BOTH
# halves of the contract — the sharesData nonce sequence AND the live on-chain cluster snapshot
# (validatorCount N, N*2.5 ETH, not a zero struct) — via the executor's live path (this D leg is
# boot-validated end-to-end by aetheria#176). 0 (default) registers the FULL set (no split); a positive
# count must be < the pool size so cohort D is non-empty (the full pool would be a no-op split). Only a CONTIGUOUS
# prefix is safe: the sharesData nonce sequence is 0-based (see contract/registration/register-validators.cjs
# and ssvlabs/ssv-mini#36). Consumed by aetheria#176's unified fork-transition suite. The ACTUAL split point
# N — plus the cohort P/D pubkey partition and the registration context (owner, operatorIds, SSVNetwork
# address) — is published at bring-up as the `pre-registered.json` enclave artifact (kurtosis files download
# <enclave> pre-registered.json): the shared source of truth that lets the executor read N and that context
# instead of re-declaring them across repos (ssvlabs/ssv-mini#53).
pre_register_count: 0

# The ethereum2-monitor (E2M) indexes SSV validator attestations and serves the
# /api/stats API that the aetheria executor's E2M validation polls. Enabled so the
# local_testnet (event) flow validates attestations end-to-end (the executor maps
# its e2m endpoint to the monitor-api service; dora is only a block explorer).
monitor:
  enabled: true

nodes:
  ssv:
    count: 4      # Valid total (ssv+anchor): 4, 7, 10, 13 (3f+1 for BFT)
  anchor:
    count: 0

# Service images default to the pins in constants.env. Override one per network with an images: block
# (keys: ssv, anchor, monitor, redis, postgres, deployer), e.g. for a local `make prepare-anchor` build:
# images:
#   anchor: "node/anchor"
