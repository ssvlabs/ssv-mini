# Network forks: genesis at Electra (deneb + electra at epoch 0); Fulu is deferred far beyond
# any test run. The ethereum2-monitor (E2M) image cannot parse Fulu beacon blocks — its indexer
# FATALs with "unknown SignedBeaconBlock version fulu" — so the E2M attestation validation the
# aetheria executor runs requires the chain to stay on Electra for the run's duration.
# To test Fulu / fork transitions, set fulu_fork_epoch back to 0 (E2M validation won't work then).
# https://github.com/ethpandaops/ethereum-package/blob/main/network_params.yaml

network:
  participants:
  - el_type: geth
    el_image: ethereum/client-go:v1.16.7
    cl_type: lighthouse
    cl_image: sigp/lighthouse:v8.0.1
    validator_count: 32
    count: 2
    supernode: true

  additional_services:
    - dora

  network_params:
    network_id: "3151908"
    deneb_fork_epoch: 0
    electra_fork_epoch: 0
    fulu_fork_epoch: 100000
    perfect_peerdas_enabled: false
    # Indices 64-73 are reserved for the aetheria local_testnet seed: deposited-but-VC-idle
    # validators the SSV operators adopt (ssvlabs/aetheria orchestrator/script/insert_test_data.sql).
    # VCs run [0, validator_count*count) = [0,64); genesis deposits [0, preregistered) = [0,74). Keep
    # validator_count*count <= 64 and preregistered_validator_count >= 74 (main.star asserts this),
    # else the operators would run VC-active validators -> double-sign -> slashing.
    preregistered_validator_count: 74

  port_publisher:
    cl:
      enabled: true

use_static_keys: true

# The ethereum2-monitor (E2M) indexes SSV validator attestations and serves the
# /api/stats API that the aetheria executor's E2M validation polls. Enabled so the
# local_testnet (event) flow validates attestations end-to-end (the executor maps
# its e2m endpoint to the monitor-api service; dora is only a block explorer).
monitor:
  enabled: true

nodes:
  ssv:
    count: 4      # Valid total (ssv+anchor): 4, 7, 10, 13 (3f+1 for BFT)
  anchor:
    count: 0

images:
  ssv: "node/ssv"
  anchor: "sigp/anchor:v1.2.0"
  monitor: "monitor"
  redis: "redis:7.4.2"
  postgres: "postgres:15"
  foundry: "localssv/ssv-network"
