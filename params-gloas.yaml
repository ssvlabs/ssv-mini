# Gloas / ePBS (EIP-7732) fork-transition test: genesis on Fulu, forks into Gloas at epoch 2.
# Usage: SSV_COMMIT=epbs-gloas make prepare && make run-gloas
#        (or: make run PARAMS_FILE=params-gloas.yaml)
#
# Clients: ethpandaops glamsterdam-devnet-8 builds — the stock geth/lighthouse releases used by
# params.yaml do NOT implement EIP-7732. devnet-8 is the live target.
# 2026-09-02: geth+lodestar bumped devnet-6 -> devnet-8 to match the node's devnet-8 Gloas spec (the
# "source beacon-chain types from go-eth2-client" repin). The devnet-6 CL computed a different
# EIP-7688/7916 progressive-merkleization block root and rejected every §4 submit with 500
# BLOCK_ERROR_INVALID_SIGNATURE (ssvlabs/ssv#3021); devnet-8 clears it — the aetheria#176 boot validated
# the full ePBS lifecycle on the 2026-09-02 pins (§4 published, §6 CONFIRMED, CL head continuity
# through the fork).
# 2026-09-27: lodestar re-pinned to the newest glamsterdam-devnet-8 build, which follows consensus-specs
# v1.7.0-beta.2 while the node's Gloas types are alpha.14-era. Between the two, the Gloas SSZ containers
# differ only in declaration syntax (the spec's SSZ-library swap) and the PTC -> PayloadTimelinessCommittee
# type renames — same fields in the same order — so the node's block/envelope roots still match; the rest
# is state-transition / validation / fork-choice logic. geth's pin is still the devnet-8 tag's newest build.
# 2026-09-28: validated on four max-scale aetheria (glamsterdam-fork) runs with this lodestar and dora (3000
# SSV validators; 4 nodes and 3 of 4): every graded §4 block landed with a full §6 payload, the CL head
# advanced through the fork, and dora indexed the Gloas blocks without a decode error.
# §4 status: the node produces, signs, and SUBMITS Gloas blocks end-to-end on devnet-8 (blocks land
# canonically) now that the block's execution requests use the EIP-8282 five-list layout — the earlier
# three-list Electra type marshaled the block 8 bytes short and lighthouse v8.2.0 rejected the submit.
# One wrinkle seen on Lodestar: it 500s the redundant all-operator submits with BLOCK_ERROR_ALREADY_KNOWN
# (the block still lands) — the "BN dedupes by root" assumption doesn't hold there (ssvlabs/ssv#2922);
# the node treats already-known as submit success, so the redundant §4 submits no longer error.
# §6 status: works END-TO-END on Lodestar (this file's pin) — produce (beacon-APIs#580) + publish. The
# node's earlier blinded publish body was rejected by Lodestar (ssvlabs/ssv#2921; fixed — it posts the
# full signed envelope), and the redundant all-operator envelope publishes hit
# EXECUTION_PAYLOAD_ENVELOPE_ERROR_ALREADY_KNOWN — treated as success since ssvlabs/ssv#2923, validated
# on this net: a (ptc),(proposer) run published 4/4 envelopes with zero submit errors. lighthouse v8.2.0
# does NOT implement the envelope-produce endpoint (GET .../execution_payload_envelopes/{slot}/{root}
# -> 404), so §6 is unreachable there — hence the Lodestar pin below (a digest-pinned devnet-8 build;
# needs the CL-agnostic EL lookup, ssvlabs/aetheria#136). Earlier Lodestar findings came from local runs
# with cl_type swapped; the pin just makes that the default.
# The genesis generator is pinned to a Gloas-aware build (the ethereum-package@6.1.0 default, 5.3.5,
# predates Gloas).
#
# Heads-up — geth below is now digest-PINNED. It used to track the moving glamsterdam-devnet-6 tag, but
# that tag drifted into a build that stalled the chain ~1.4 epochs past the Gloas fork; it's pinned to a
# build validated to sustain liveness ~30 epochs past the fork (ssvlabs/ssv-mini#38). Every image here is
# now pinned to a fixed build (geth + CL by digest, dora + generator by fixed tag), so the net is
# reproducible. To advance with devnet-8: `docker pull ethpandaops/geth:glamsterdam-devnet-8`, read its
# digest (`docker inspect --format '{{index .RepoDigests 0}}' ethpandaops/geth:glamsterdam-devnet-8`),
# validate a run, then bump el_image below.
#
# Gloas is purely beacon-driven on the SSV side: the node reads GLOAS_FORK_EPOCH from the beacon
# node's /config/spec at runtime, so no SSV-side fork knob is needed. Boole (the SSV-protocol fork) is
# independent of Gloas and — postponed by the SSV team — stays DORMANT through Glamsterdam, so ePBS is
# validated pre-Boole (Alan): per-validator aggregator runner, Alan gossip topics/domain. boole_epoch
# below is a dormant far-future epoch (its inline note explains why not the math.MaxUint64 sentinel);
# override via BOOLE_FORK_EPOCH to activate Boole (the (boole) suite on local_testnet_boole covers it).
#
# Monitor (E2M) was historically disabled on this net — the monitor couldn't decode GLOAS blocks
# (go-eth2-client v0.28.1 has no Gloas types → it FATAL'd on the post-fork epochs). ethereum2-monitor#504
# (merged) fixes that with a Gloas block decode for attestation validation. Fulu is NOT a blocker: it's
# decoded natively (go-eth2-client v0.28.1 has first-class Fulu types, and the monitor has beacon/fulu.go
# + Fulu cases in its block/resolver switches), so a #504-inclusive monitor handles this net's Fulu
# (epochs 0-1) AND Gloas (epoch 2+) blocks. ssv-mini builds the monitor from origin/main, so its image
# already includes #504.
# E2M is ENABLED below. Validated live — E2M §2 attestation confirmation works on Gloas (the first live
# exercise of #504's Gloas block decode + store.SaveBlock); tracked in ssvlabs/aetheria#137. Dependency: a
# gloas (event) run also needs the executor's local_testnet E2M-removal-skip — the strict removal "eviction"
# teardown check (attestations.Assigned→0) false-fails across the WHOLE local_testnet family (NOT
# Gloas-specific; Loki still verifies removal there), so it's skipped on local; without that executor fix the
# run reds on the removal teardown despite §2 passing. Caveat: on Gloas the execution payload moves to the §6 envelope, so #504 stubs exec-data
# (fee-recipient / block-number / txs / MEV) — E2M's EXECUTION checks stay degraded until sourced from the
# envelope; §2 ATTESTATION validation is unaffected. Meanwhile, observe ePBS via the SSV node logs and dora.

network:
  participants:
  - el_type: geth
    # Digest-pinned geth glamsterdam-devnet-8 (bumped from devnet-6 on 2026-09-02; resolved from the
    # moving glamsterdam-devnet-8 tag). The devnet-6 geth was pinned for liveness (ssvlabs/ssv-mini#38);
    # this devnet-8 build sustained liveness through the Gloas fork in the aetheria#176 boot (CL head
    # continuity passed); keep watching for a stall on longer runs.
    el_image: ethpandaops/geth@sha256:50fad280c7e2a2d7df835b46753c7633882824fbf545efb63c03451f910090e8
    cl_type: lodestar
    # Digest-pinned Lodestar glamsterdam-devnet-8-f1b14bc, the moving glamsterdam-devnet-8 tag's newest build
    # as of 2026-09-27 (re-pinned then from the tag's 2026-09-02 build, which had replaced the devnet-6-era
    # unstable-2e78647 snapshot; the spec gap is covered in the header). Rationale: the node's Gloas block
    # types follow the devnet-8 spec, so a devnet-6 CL computed a different EIP-7688/7916 progressive-
    # merkleization root and rejected every §4 submit with 500 BLOCK_ERROR_INVALID_SIGNATURE (ssvlabs/ssv#3021);
    # a devnet-8 CL matches the node's root. (devnet-8 lodestar retains §6 produce+publish and §5 proposer_preferences.)
    cl_image: ethpandaops/lodestar@sha256:c5d9cfb9d93c182edc6883f58de847af18a70293ce7573259236da695ea248d1
    # VC cohort = validator_count*count = the always-on majority the chain self-justifies on while the SSV
    # pool (indices [SSV_SEED_START_INDEX, +count)) is > 1/3 of the set — must equal
    # constants.SSV_SEED_START_INDEX, the SSV seed start. Without a VC majority the chain can't justify
    # before SSV adopts, and SSV's slashing protection (adoption-epoch highest-source vs the stuck source=0)
    # then refuses every attestation as a surround vote — a permanent genesis-bootstrap deadlock
    # (aetheria#176). This value is set per test suite by aetheria's provision-pool.sh (VC/count): the
    # small default below (32*2 = 64 VC) for every suite, scaled up for glamsterdam-fork's large pool
    # (e.g. 3600*2 = 7200 VC for a 3000-validator pool, ~29% SSV).
    validator_count: 32
    count: 2
    supernode: true

  additional_services:
    - dora

  # dora's default image can't render Gloas blocks; pin a Gloas-capable master build. The previous pin,
  # master-0e63023 (2026-06-30), predates devnet-8's five-list execution requests (EIP-8282): it can't
  # decode the Gloas block bodies ("ParentExecutionRequests.Deposits: incorrect offset: first offset 20
  # does not match expected 12"), so its indexer stalls at the fork and retries every 10 s. Master builds
  # since the 2026-08-12 go-eth2-client / dynamic-ssz bump carry the regenerated SSZ types.
  dora_params:
    image: ethpandaops/dora:master-3d0d825

  # Pin a Gloas-aware generator build (rationale in the header).
  ethereum_genesis_generator_params:
    image: ethpandaops/ethereum-genesis-generator:6.0.8

  network_params:
    network_id: "3151908"
    deneb_fork_epoch: 0
    electra_fork_epoch: 0
    fulu_fork_epoch: 0        # Fulu must precede Gloas — activate at genesis
    gloas_fork_epoch: 2       # ePBS fork; small so the transition lands a few minutes in (tune freely)
    perfect_peerdas_enabled: false
    preregistered_validator_count: 74

  port_publisher:
    cl:
      enabled: true

use_static_keys: true

# pre_register_validators for the gloas net. See params.yaml for the flag's full semantics and its
# incompatibility with the executor's validator-registering suites. Enabled here, the deployer
# bulk-registers the full static keyshare set at bring-up so the fleet runs SSV-managed validators
# from genesis — which the aetheria (transition) suite's per-validator fork-transition checks need
# (aetheria#141 A2).
pre_register_validators: false

# pre_register_count partitions the static keyshare pool when pre_register_validators is true: register
# only the first N keyshares as cohort P, leaving the rest for the aetheria executor's committee suites
# to register as cohort D at keystore offset N — the index-partitioned split that lets pre-registration
# and a registering suite share one enclave (aetheria#176; the unified glamsterdam-fork suite runs here).
# 0 (default) registers the FULL set. See params.yaml for the full semantics and the #36 prefix constraint.
pre_register_count: 0

# unsafe_skip_validator_layout_guard bypasses main.star's 64/74 validator-layout guard so a STANDALONE
# base-chain liveness probe can run more than 64 baseline validators (ssvlabs/ssv-mini#38: does the
# Gloas/ePBS devnet stall ~1.4 epochs past the fork because a 74-validator set gives degenerate
# attestation-committee / PTC coverage?). To use it: set this true, raise the participants'
# validator_count (and/or count) AND preregistered_validator_count together to the new VC total (e.g.
# validator_count: 64 x count: 2 = 128 VCs, preregistered_validator_count: 128), and set
# monitor.enabled: false (the monitor needs SSV validators and FATAL-crashes on a head-stall), then run.
# SAFE ONLY on a bare run with pre_register_validators: false AND no aetheria executor - the SSV nodes
# then adopt zero beacon validators (Step 4 skipped), so the larger VC set never overlaps the SSV seed.
# Combining with pre_register_validators: true is rejected by main.star (that half is detectable in-repo).
# The aetheria half can't be, so do NOT set this against an executor validator-registering suite
# ((event)/(ptc)/(proposer)/(p2p)) either, or the extra VCs overlap the SSV seed [64, 64+N) -> double-sign -> slashing.
unsafe_skip_validator_layout_guard: false

monitor:
  enabled: true    # ENABLED: E2M §2 validated on Gloas (ssvlabs/aetheria#137); removal teardown E2M is skipped on local_testnet by the executor

boole_epoch: 1000000000   # dormant far-future epoch — never reached in a run, so ePBS stays pre-Boole (Alan). Not math.MaxUint64/1<<63: the node's Validate() overflows on a scheduled boole epoch > ~5.76e17, only the exact MaxUint64 sentinel counts as unscheduled, and the config pipeline float-rounds it.

nodes:
  ssv:
    count: 4
  anchor:
    count: 0
  # Archive-exporter node the aetheria Gloas exporter-coverage steps read (ssvlabs/aetheria#181): it
  # serves /v1/exporter/traces/validator + /v1/exporter/decideds for the Gloas duties (PTC_ATTESTER,
  # PROPOSER_PREFERENCES, the two-root PROPOSER packet — ssvlabs/ssv#3045). Trace routes need an
  # archive-mode node; a standard node serves decideds only. Singular by design — the aetheria side
  # pins the hostname `ssv-exporter` — so this is a boolean, not a count.
  exporter:
    enabled: true

images:
  ssv: "node/ssv"
  anchor: "sigp/anchor:v1.3.1"
  monitor: "monitor"
  redis: "redis:7.4.2"
  postgres: "postgres:15"
  deployer: "localssv/ssv-network"
